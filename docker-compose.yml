services:
  dev:
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
      args:
        INSTALL_TORCH: "true"
    image: intellicore/dev:local
    container_name: intellicore-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - gem5-source:/opt/gem5
      - pip-cache:/root/.cache/pip
    env_file:
      - .env
    environment:
      GEM5_ROOT: /opt/gem5
      PYTHONPATH: /workspace/services/control-plane/src:/workspace/services/training/src
    profiles:
      - dev
    command: sleep infinity

  gem5-shell:
    image: intellicore/dev:local
    container_name: intellicore-gem5-shell
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - gem5-source:/opt/gem5
      - gem5-build:/opt/gem5/build
    environment:
      GEM5_ROOT: /opt/gem5
      PYTHONPATH: /workspace/services/control-plane/src:/workspace/services/training/src
    profiles:
      - gem5
    command: bash
    stdin_open: true
    tty: true

  supabase-check:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    env_file:
      - .env
    profiles:
      - tools
    command: >-
      sh -c "python -m pip install --no-cache-dir 'psycopg[binary]' &&
      python scripts/check_db.py"

volumes:
  gem5-source:
  gem5-build:
  pip-cache:
