[project]
name = "intellicore-control"
version = "0.1.0"
description = "CLI and orchestration layer for IntelliCore simulation runs."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[project.scripts]
intellicore = "intellicore_control.cli:app"
