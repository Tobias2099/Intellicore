services:
  dev:
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
      args:
        INSTALL_TORCH: "true"
    image: intellicore/dev:local
    container_name: intellicore-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - gem5-source:/opt/gem5
      - pip-cache:/root/.cache/pip
    env_file:
      - .env
    environment:
      GEM5_ROOT: /opt/gem5
      PYTHONPATH: /workspace/services/control-plane/src:/workspace/services/training/src
    profiles:
      - dev
    command: sleep infinity

  gem5-shell:
    image: intellicore/dev:local
    container_name: intellicore-gem5-shell
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - gem5-source:/opt/gem5
      - gem5-build:/opt/gem5/build
    environment:
      GEM5_ROOT: /opt/gem5
      PYTHONPATH: /workspace/services/control-plane/src:/workspace/services/training/src
    profiles:
      - gem5
    command: bash
    stdin_open: true
    tty: true

  gem5-prebuilt:
    build:
      context: .
      dockerfile: infra/docker/gem5-prebuilt.Dockerfile
      args:
        INSTALL_TORCH: "false"
        GEM5_REPO: https://gem5.googlesource.com/public/gem5
        GEM5_REF: ""
        GEM5_CLONE_DEPTH: "1"
        GEM5_ISA: X86
        GEM5_BUILD_VARIANT: gem5.opt
        GEM5_BUILD_JOBS: "2"
    image: intellicore/gem5:local
    container_name: intellicore-gem5-prebuilt
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      GEM5_ROOT: /opt/gem5
      PYTHONPATH: /workspace/services/control-plane/src:/workspace/services/training/src
    profiles:
      - gem5
    command: bash
    stdin_open: true
    tty: true

  supabase-check:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    env_file:
      - .env
    profiles:
      - tools
    command: >-
      sh -c "python -m pip install --no-cache-dir -r requirements-dev.txt &&
      PYTHONPATH=services/control-plane/src python scripts/check_db.py"

  supabase-migrate:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    env_file:
      - .env
    profiles:
      - tools
    command: >-
      sh -c "python -m pip install --no-cache-dir -r requirements-dev.txt &&
      alembic upgrade head &&
      PYTHONPATH=services/control-plane/src python scripts/check_db.py &&
      PYTHONPATH=services/control-plane/src python scripts/check_orm.py"

  supabase-auto-migrate:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    env_file:
      - .env
    environment:
      PYTHONPATH: /workspace/services/control-plane/src
    profiles:
      - tools
    command: >-
      sh -c "python -m pip install --no-cache-dir -r requirements-dev.txt &&
      python scripts/auto_migrate.py"

  supabase-revision:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    env_file:
      - .env
    profiles:
      - tools
    command: >-
      sh -c "python -m pip install --no-cache-dir -r requirements-dev.txt &&
      alembic revision --autogenerate -m \"$${MIGRATION_MESSAGE:-schema change}\""

  supabase-orm-check:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    env_file:
      - .env
    profiles:
      - tools
    command: >-
      sh -c "python -m pip install --no-cache-dir -r requirements-dev.txt &&
      PYTHONPATH=services/control-plane/src python scripts/check_orm.py"

volumes:
  gem5-source:
  gem5-build:
  pip-cache:
